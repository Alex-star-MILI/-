server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gym-server

  # H2 内嵌数据库（演示用，零配置启动）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/gymdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    # H2 控制台
    h2:
      console:
        enabled: true
        path: /h2-console

  # SQL 初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8

  jackson:
    date-format: yyyy-MM-dd
    time-zone: GMT+8

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gym.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true

logging:
  level:
    com.gym: debug
